query GetProject($orgLogin: String!, $projectNumber: Int!, $itemsAfter: String) {
  organization(login: $orgLogin) {
    projectV2(number: $projectNumber) {
      id
      title
      items(first: 50, after: $itemsAfter) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ... on ProjectV2Item {
            __typename
            fieldValueByName(name: "Lane") {
              ... on ProjectV2ItemFieldSingleSelectValue {
                name
              }
            }
            content {
              __typename
              ... on Issue {
                number
                title
                issueType {
                  name
                }
                timelineItems(first: 100) {
                  nodes {
                    ... on ProjectV2ItemStatusChangedEvent {
                      createdAt
                      status
                      previousStatus
                      project {
                        number
                        title
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
